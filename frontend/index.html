    <!--
      DESIGN CONTRACT (v2)
      THESIS: A night-time intelligence console. Findings are read from three separate instruments (style, evidence,
        trust) that are never merged into a verdict. Refuses: a single fake-or-real score, decoration without meaning.
      WORLD: Midnight indigo ground (#080B18), layered glass panels, violet for action, cyan for analysis, amber for
        caution. Inter for headings and the interface, JetBrains Mono for measurements, Instrument Serif only
        for the hero line and the replacement words in the landing story.
      STORY: Headlines are believed, shared, trusted; VERITAS strikes each reflex and replaces it with a question.
      DOCS: PRODUCT.md (product), DESIGN.md (system).
    -->
