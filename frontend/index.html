      DESIGN CONTRACT
      THESIS: A galley-proof desk for investigating text. Findings are margin marks and queries beside serif text; the
        one authored moment is signal resolving out of noise. Refuses: a verdict score, a card grid, a glowing AI dashboard.
      OWN-WORLD: Obsidian ground, warm-paper text, one cyan "instrument" accent; amber for caution, green/red only as system
        states. Bodoni Moda for voice, Hanken Grotesk for interface, Azeret Mono for ids, times and measurements.
      STORY: The visitor sees text being separated into noise and signal, understands the tool measures and retrieves but never
        rules, and opens an investigation.
      FIRST VIEWPORT: Left, a serif headline and one action; right, a bleeding canvas proof sheet where a scan beam and the
        pointer loupe resolve noisy traces into legible lines with margin marks. Primary action sits under the headline.
      FORM: Galley-proof desk (candidate 3), pinned by the brief; seed key 384222ff.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
