# VERITAS AI: full stack (PostgreSQL + backend + frontend).
#
#   docker compose up -d db            database only (development: run backend/frontend locally)
#   docker compose up -d --build       the whole stack
#
# Secrets come from the root .env file (see .env.example); nothing secret is stored in this file.
# The classifier files and embedding model are large and git-ignored: they are mounted read-only
# from ./backend/ml_artifacts and ./models (see docs/ml-setup.md for how to create them).

services:
  db:
    image: postgres:16-alpine
    container_name: veritas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veritas_db}
      POSTGRES_USER: ${POSTGRES_USER:-veritas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritas_user} -d ${POSTGRES_DB:-veritas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - veritas-network

  backend:
    build:
      context: ./backend
    container_name: veritas_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is reachable as "db" on its internal port.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-veritas_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/${POSTGRES_DB:-veritas_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      PRELOAD_MODELS: "true"
    volumes:
      - ./models:/models:ro
      - ./backend/ml_artifacts:/artifacts:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - veritas-network

  frontend:
    build:
      context: ./frontend
    container_name: veritas_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # nginx serves the app and proxies /api/ to the backend service, so one public address is enough.
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    networks:
      - veritas-network

volumes:
  postgres_data:
    name: veritas_postgres_data

networks:
  veritas-network:
    driver: bridge
